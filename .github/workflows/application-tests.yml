name: Application test suite

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run application tests
        env:
          SECRET_KEY: ci-test-secret
          DATABASE_URL: sqlite:///instance/ci-test.db
          ADMIN_PASSWORD: ci-test-admin-password
        run: python -m unittest discover -s tests -p "test_*.py" -q

      - name: Run aftershock checks
        run: python -m unittest discover -s tests -p "test_aftershock.py" -q
