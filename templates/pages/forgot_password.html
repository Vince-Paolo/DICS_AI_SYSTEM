{% extends 'pages/base.html' %}

{% block title %}Forgot Password | DICS AI{% endblock %}

{% block content %}
<h1 class="visually-hidden">Forgot Password</h1>
<div class="auth-shell">
    <div class="auth-card">
        {% include 'partials/auth_header.html' %}

        <div class="auth-body">
            <p class="text-muted mb-3">Enter your email address to receive a reset link.</p>

            <form method="post" action="{{ url_for('forgot_password') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <label class="auth-label" for="email">Email address</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>

                <button class="btn btn-auth w-100 mt-3" type="submit">Send reset link</button>
            </form>

            <div class="auth-footer">
                <a href="{{ url_for('login') }}">Back to login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
