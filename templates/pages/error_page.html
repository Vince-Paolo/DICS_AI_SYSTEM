{% extends 'pages/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1 class="visually-hidden">{{ title }}</h1>
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card card-custom">
            <div class="card-body p-5 text-center">
                <div class="icon-badge icon-badge-{{ variant }} mx-auto mb-4" style="width:72px; height:72px; font-size:1.75rem;">
                    <i class="bi {{ icon }}" aria-hidden="true"></i>
                </div>
                <div class="fw-bold mb-2" style="font-size:3rem; letter-spacing:0.05em; line-height:1;">{{ code }}</div>
                <h2 class="h4 mb-3">{{ title }}</h2>
                <p class="text-muted mb-4">{{ message }}</p>
                <div class="d-flex justify-content-center gap-2 flex-wrap">
                    {% if session.username %}
                    <a href="{{ url_for('dashboard') }}" class="btn btn-primary-modern btn-modern">
                        <i class="bi bi-house-door-fill me-2"></i>Go to Dashboard
                    </a>
                    {% else %}
                    <a href="{{ url_for('login') }}" class="btn btn-primary-modern btn-modern">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Back to Login
                    </a>
                    {% endif %}
                    <a href="#" onclick="history.back(); return false;" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-arrow-left me-1"></i>Go Back
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
