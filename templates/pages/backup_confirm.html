{% extends 'pages/base.html' %}

{% block title %}Confirm Backup Export{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card">
                <div class="card-body">
                    <h3 class="card-title mb-4">Confirm Database Backup</h3>
                    <p class="text-muted">For security and audit purposes, administrators must confirm their password before exporting the SQLite backup.</p>
                    <form method="POST" action="{{ url_for('admin.export_backup') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label for="password" class="form-label">Current password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Confirm and export</button>
                            <a href="{{ url_for('admin.manage_users') }}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
