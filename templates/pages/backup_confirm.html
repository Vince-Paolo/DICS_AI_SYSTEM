{% extends 'pages/base.html' %}

{% block title %}Confirm Backup Export{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card backup-confirm-card">
                <div class="card-body backup-confirm-body">
                    <h3 class="card-title backup-confirm-title mb-4">Confirm Database Backup</h3>
                    <p class="backup-confirm-copy">For security and audit purposes, administrators must confirm their password before exporting the SQLite backup.</p>
                    <form method="POST" action="{{ url_for('admin.export_backup') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3 backup-confirm-field">
                            <label for="password" class="form-label backup-confirm-label">Current password</label>
                            <input type="password" class="form-control backup-confirm-input" id="password" name="password" required>
                        </div>
                        <div class="d-flex gap-2 backup-confirm-actions">
                            <button type="submit" class="btn backup-confirm-submit">Confirm and export</button>
                            <a href="{{ url_for('admin.manage_users') }}" class="btn backup-confirm-cancel">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
