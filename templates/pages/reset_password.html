{% extends 'pages/base.html' %}

{% block title %}Reset Password | DICS AI{% endblock %}

{% block content %}
<h1 class="visually-hidden">Reset Password</h1>
<div class="auth-shell">
    <div class="auth-card">
        {% include 'partials/auth_header.html' %}

        <div class="auth-body">
            {% if error %}
                <div class="alert alert-danger rounded-3">{{ error }}</div>
            {% endif %}

            <form method="post" action="{{ url_for('reset_password', token=token) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <label class="auth-label" for="new_password">New password</label>
                <input type="password" class="form-control" id="new_password" name="new_password" placeholder="At least 8 characters" minlength="8" required>

                <label class="auth-label" for="confirm_password">Confirm new password</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" minlength="8" required>

                <button class="btn btn-auth w-100 mt-3" type="submit">Update password</button>
            </form>

            <div class="auth-footer">
                <a href="{{ url_for('login') }}">Back to login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
