{% extends 'pages/base.html' %}

{% block title %}{{ _('Register') }} | DICS AI{% endblock %}

{% block content %}
<h1 class="visually-hidden">{{ _('Register') }}</h1>
<div class="auth-shell">
    <div class="auth-card">
        {% include 'partials/auth_header.html' %}

        <div class="auth-body">
            {% if error %}
                <div class="alert alert-danger rounded-3">{{ error }}</div>
            {% endif %}

            <form method="post" action="/register" data-required-legend="true">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <label class="auth-label" for="full_name">{{ _('Full name') }}</label>
                <input type="text" class="form-control" id="full_name" name="full_name" placeholder="{{ _('Enter full name') }}" required>

                <label class="auth-label" for="email">{{ _('Email') }}</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="{{ _('Enter email address') }}" required>

                <label class="auth-label" for="username">{{ _('Username') }}</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="{{ _('Enter username') }}" required>

                <label class="auth-label" for="contact_number">{{ _('Contact number') }}</label>
                <input type="tel" class="form-control" id="contact_number" name="contact_number" placeholder="{{ _('Enter contact number') }}" required>

                <label class="auth-label" for="password">{{ _('Password') }}</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="{{ _('Enter password') }}" required>

                <button class="btn btn-auth w-100 mt-1" type="submit">{{ _('Create account') }}</button>
            </form>

            <div class="auth-footer">
                <span>v2.4 &middot; Region IV-A</span>
                <a href="/">{{ _('Already have an account? Login') }}</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
